# Security headers of the panel (E39 W5 spec §9.1), sent with `always` so
# that error pages carry them too. NGINX does not inherit add_header into a
# location that has one of its own: such a location includes this file (or
# security-headers-files.conf) again, which test/arcpanel-panel-headers.bats
# checks.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
# Written by v-update-sys-panel-headers and v-change-sys-arcpanel-hsts; the
# globs let the panel start without them
include    csp.con[f];
include    hsts.con[f];
