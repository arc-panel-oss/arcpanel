# Security headers of file downloads (E39 W5 spec §9.3): those of
# security-headers.conf without the panel's Content-Security-Policy; the
# download location adds the sandbox policy of its upstream instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
include    hsts.con[f];
