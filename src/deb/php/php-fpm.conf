[global]
pid = /run/arcpanel-php.pid
daemonize = yes
log_level = error
emergency_restart_threshold = 10
emergency_restart_interval = 60s
process_control_timeout = 10s
events.mechanism = epoll

[www]
listen = /run/arcpanel-php.sock

user = arcpanelweb
group = arcpanelweb

listen.owner = arcpanelweb
listen.group = arcpanelweb
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.max_requests = 1000
pm.process_idle_timeout = 10s;

; Inside open_basedir, which leaves out /: the command runner checks its
; working directory, and the commands it starts run as hosting users who
; may all enter /tmp (E39 W5 L15)
chdir = /tmp

env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp
env[ARCPANEL] = $ARCPANEL
env[LANG] = en_US.UTF-8

php_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = "Strict"
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[session.save_path] = /usr/local/arcpanel/data/sessions
; E39 W5 L15: the panel reads only these folders; the last one is the backup
; folder (BACKUP of arcpanel.conf), written by panel_php_basedir_write
php_admin_value[open_basedir] = /usr/local/arcpanel/web-app/:/usr/local/arcpanel/lib/:/usr/local/arcpanel/data/:/etc/arcpanel/:/tmp/:/backup/
; exec stays for API v1, proc_open for the command runner
php_admin_value[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,pcntl_unshare,system,passthru,shell_exec,popen,dl
