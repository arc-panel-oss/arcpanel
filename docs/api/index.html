<!doctype html>
<!-- Swagger UI for the REST API documents: v1 (docs/api/openapi.yaml, E29 spec §7) and v2 (docs/api/v2/openapi.json, E34 spec §7). -->
<!-- Serve this folder over HTTP: browsers block fetch() from file:// (see README.md). Open with ?api=v2 to start on API v2. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ArcPanel REST API</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css"
		/>
		<style>
			body {
				margin: 0;
				background: #fff;
			}
		</style>
	</head>
	<body>
		<div id="swagger-ui"></div>
		<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-standalone-preset.js"></script>
		<script>
			const documents = [
				{ url: "openapi.yaml", name: "API v1 (commands, /api/)" },
				{ url: "v2/openapi.json", name: "API v2 (resources, /api/v2/)" },
			];

			// API v1 only: an empty access_key would select access-key authentication,
			// and an empty argument is not the same as a missing one for the commands.
			// API v2 requests keep their bodies as typed.
			function dropEmptyFields(request) {
				if (request.url.includes("/api/v2/")) {
					return request;
				}
				if (typeof request.body !== "string" || request.body === "") {
					return request;
				}
				const type = Object.entries(request.headers).find(
					([name]) => name.toLowerCase() === "content-type",
				)?.[1];
				if (type?.startsWith("application/x-www-form-urlencoded")) {
					const form = new URLSearchParams(request.body);
					for (const [name, value] of [...form]) {
						if (value === "") form.delete(name);
					}
					request.body = form.toString();
				} else if (type?.startsWith("application/json")) {
					const data = JSON.parse(request.body);
					for (const name of Object.keys(data)) {
						if (data[name] === "") delete data[name];
					}
					request.body = JSON.stringify(data);
				}
				return request;
			}

			window.addEventListener("load", () => {
				const v2 = new URLSearchParams(window.location.search).get("api") === "v2";
				window.ui = SwaggerUIBundle({
					urls: documents,
					"urls.primaryName": documents[v2 ? 1 : 0].name,
					dom_id: "#swagger-ui",
					presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
					layout: "StandaloneLayout",
					deepLinking: true,
					docExpansion: "none",
					filter: true,
					defaultModelsExpandDepth: -1,
					// Every call changes a real server: "Try it out" stays off until clicked
					tryItOutEnabled: false,
					requestInterceptor: dropEmptyFields,
				});
			});
		</script>
	</body>
</html>
