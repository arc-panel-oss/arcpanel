name: Bug Report
description: File a bug report and help us to improve ArcPanel
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If you have encountered a bug or problem in ArcPanel, use this form to let us know.
        To report a security vulnerability, do not use this form: follow the [security policy](https://github.com/arc-panel-oss/arcpanel/security/policy) instead.
        **Important: DO NOT include any private/sensitive information such as email addresses, passwords, IP addresses, or hostnames.**
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: |
        A clear description of what the bug is. Include as much detail as possible, such as the configuration of your server and any troubleshooting steps that you've already performed.
      placeholder: Tell us exactly what you see!
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Tell us how to replicate the bug
      description: |
        What steps did you take when the bug occurred or things did not work as you expected?
      placeholder: |
        1. Click on the Web tab.
        2. Click on Add Web Domain.
        3. Attempted to add a domain and received an Internal Server Error after pressing Save.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which components are affected by this bug?
      multiple: true
      options:
        - Installation or upgrade
        - Web interface
        - Command line (v-* commands)
        - REST API
        - Users, packages and resellers
        - Web domains and web server (Nginx, Apache)
        - SSL (Let's Encrypt)
        - DNS
        - Mail and mail security (Exim, Dovecot, antivirus, antispam)
        - Webmail and database tools (Roundcube, SnappyMail, phpMyAdmin)
        - Databases (MariaDB, MySQL, PostgreSQL)
        - Backups and restore
        - Firewall and Fail2ban
        - Node.js and Docker apps
        - File manager and web terminal
        - Update Center
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ArcPanel Version
      description: Shown on the About page, or run `grep ^VERSION= /usr/local/arcpanel/conf/arcpanel.conf`.
      placeholder: 2.2.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 or Debian 12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log capture
      description: Copy and paste any relevant log output in the field below. This will be automatically formatted into code, so no need for backticks. **Remove any sensitive information before submitting!**
      render: shell
  - type: markdown
    attributes:
      value: |
        *Thank you* for taking the time to fill out this bug report.
