name: Feature
description: Suggest a new idea or change
title: "[Feature] "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Is there a feature or change that you think would make ArcPanel work better for you? Send us your ideas and our development team will take them into consideration.
        Before submitting a new idea, look at the **[current feature requests list](https://github.com/arc-panel-oss/arcpanel/labels/feature)** to see if it has already been requested.
  - type: textarea
    id: request
    attributes:
      label: Describe the feature or change in detail
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Thank you** for taking the time to send us your request, we appreciate your contribution.
