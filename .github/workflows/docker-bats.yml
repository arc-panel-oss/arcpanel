name: Docker BATS

# Installs ArcPanel in a systemd container on Ubuntu 24.04 and runs test/test.bats.
# Called by pr-docker-bats.yml (amd64, the arcpanel package built from the checkout, the
# engines from the APT repository) and arm64-trial.yml (arm64, every package from the
# artifact of the run's build). See E47
# (docs/features/specs/2026-10-20-003-e47-arm64-packages-design.md §5.4).

on:
  workflow_call:
    inputs:
      runner:
        description: "ubuntu-24.04 or ubuntu-24.04-arm"
        required: false
        type: string
        default: ubuntu-24.04
      debs-artifact:
        description: "Artifact of this run with all packages, for example debs-noble-arm64; empty builds the arcpanel package"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docker-bats:
    name: Install and BATS
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download packages
        if: inputs.debs-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.debs-artifact }}
          path: debs-in

      - name: Build CI container
        run: |
          docker build \
            -f .github/docker/arcpanel-ci.Dockerfile \
            -t arcpanel-ci:${{ github.sha }} \
            .

      - name: Start CI container
        run: |
          docker run -d \
            --name arcpanel-ci \
            --hostname arcpanel-dev.local \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec,mode=1777 \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            --dns 2001:4860:4860::8888 \
            --dns 2001:4860:4860::8844 \
            -e TZ=UTC \
            -e LANG=en_US.UTF-8 \
            -e LC_ALL=en_US.UTF-8 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${GITHUB_WORKSPACE}:/arcpanel-git" \
            -w /arcpanel-git \
            arcpanel-ci:${{ github.sha }}
          for _ in {1..100}; do
            docker exec arcpanel-ci bash -lc 'systemctl is-system-running 2>/dev/null | grep -Eq "running|degraded"' && break
            sleep 0.1
          done

      - name: Install ArcPanel
        env:
          DEBS_ARTIFACT: ${{ inputs.debs-artifact }}
          # The engine packages come from the stable repository, even on a line between tags
          ARCPANEL_APT_CHANNEL: stable
        run: |
          docker exec -e DEBS_ARTIFACT -e ARCPANEL_APT_CHANNEL arcpanel-ci bash -lc '
            set -euxo pipefail
            export TERM=xterm
            if [ -n "${DEBS_ARTIFACT}" ]; then
              # Every package comes from the build of this run (artifact folder debs-in/<codename>/)
              DEB_PATH="$(find /arcpanel-git/debs-in -mindepth 1 -maxdepth 1 -type d | head -n 1)"
              ls -la "${DEB_PATH}"
              # Installs on arm64 are not supported yet; CI tests them anyway (E47 D7)
              export ARCPANEL_ALLOW_UNSUPPORTED_ARCH=yes
            else
              cd /arcpanel-git/src
              # The build folder must be owned by root with mode 0700 (E39 W1 D13)
              install -d -m 700 /tmp/arcpanel-src
              BUILD_DIR=/tmp/arcpanel-src bash ./arcpanel-build.sh --arcpanel --noinstall --keepbuild "~localsrc"
              DEB_PATH=""
              if [[ -f "/tmp/arcpanel-src/deb" ]]; then
                pkg="$(dpkg-deb -f /tmp/arcpanel-src/deb Package)"
                ver="$(dpkg-deb -f /tmp/arcpanel-src/deb Version)"
                arch="$(dpkg-deb -f /tmp/arcpanel-src/deb Architecture)"
                DEB_PATH="/tmp/arcpanel-src/debs"
                mkdir -p "${DEB_PATH}"
                cp /tmp/arcpanel-src/deb "${DEB_PATH}/${pkg}_${ver}_${arch}.deb"
              fi
              if compgen -G "/tmp/arcpanel-src/deb/arcpanel_*.deb" >/dev/null; then
                DEB_PATH="/tmp/arcpanel-src/deb"
              elif compgen -G "/tmp/arcpanel-src/debs/arcpanel_*.deb" >/dev/null; then
                DEB_PATH="/tmp/arcpanel-src/debs"
              else
                echo "No local arcpanel debs found under /tmp/arcpanel-src/{deb,debs}"
                ls -la /tmp/arcpanel-src || true
                ls -la /tmp/arcpanel-src/deb || true
                ls -la /tmp/arcpanel-src/debs || true
                exit 1
              fi
              # The engine packages come from the stable APT repository.
            fi
            cd /arcpanel-git
            bash install/arcpanel-install-ubuntu.sh \
              --hostname arcpanel.local.test \
              --email admin@example.com \
              --username admin \
              --password Password123 \
              --interactive no \
              --force \
              --with-debs "${DEB_PATH}" \
              --clamav no \
              --spamassassin no
          '

      - name: Check the shipped panel nginx configuration
        run: |
          docker exec arcpanel-ci bash -lc '
            set -euxo pipefail
            # The arcpanel-nginx package of this line ships the header files that
            # nginx.conf includes; CI installs the engine of the stable channel.
            install -m 0644 /arcpanel-git/src/deb/nginx/security-headers.conf /arcpanel-git/src/deb/nginx/security-headers-files.conf /usr/local/arcpanel/nginx/conf/
            install -m 0644 /arcpanel-git/src/deb/nginx/nginx.conf /usr/local/arcpanel/nginx/conf/nginx-ci.conf
            /usr/local/arcpanel/nginx/sbin/arcpanel-nginx -t -c /usr/local/arcpanel/nginx/conf/nginx-ci.conf
            rm -f /usr/local/arcpanel/nginx/conf/nginx-ci.conf
          '

      - name: Run BATS test suite
        run: |
          docker exec arcpanel-ci bash -lc '
            set -euxo pipefail
            cd /arcpanel-git
            if ! command -v bats >/dev/null 2>&1; then
              test/test_helper/bats-core/install.sh /usr/local
            fi
            bats test/test.bats
          '

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec arcpanel-ci bash -lc 'journalctl --no-pager -n 500' || true
          docker exec arcpanel-ci bash -lc 'ls -la /root/arcpanel_install_backups || true' || true
          docker exec arcpanel-ci bash -lc 'tail -n 500 /root/arcpanel_install_backups/arc_install-*.log || true' || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f arcpanel-ci || true
