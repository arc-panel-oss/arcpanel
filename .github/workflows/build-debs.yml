name: Build packages

# Builds the ArcPanel packages for a matrix of distributions and architectures and uploads
# them as artifacts "debs-<codename>-<arch>" of the calling run. Called by release.yml (to
# publish) and arm64-trial.yml (to test only); see E47
# (docs/features/specs/2026-10-20-003-e47-arm64-packages-design.md §5.2).
#
# arcpanel-nginx, arcpanel-php and arcpanel-web-terminal come from the Actions cache while
# their sources, src/arcpanel-build.sh, src/sources.sha256 and func/download.sh are
# unchanged. A cache is scoped to the ref that saved it, so a release tag reads only its own
# entries and those of the default branch.

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON {"image":[...],"arch":[...]}'
        required: true
        type: string
      channel:
        description: "stable, beta or trial; part of the engine cache key"
        required: true
        type: string
      save-cache:
        description: "Save newly built engine packages to the Actions cache"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    # In a container job, run steps default to sh; dash in debian:12 has no "set -o pipefail".
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl wget ca-certificates lsb-release sudo

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arcpanel-nginx, arcpanel-php and arcpanel-web-terminal are compiled from source and rarely change:
      # reuse them while their sources (src/deb/<package>/) and the build script (library versions) are unchanged.
      # The build script stamps every package with the pre-release tag (~alpha.4), so each channel has its own
      # cache: a stable release never ships engines labelled with a pre-release.
      - name: Restore engine packages
        id: engines
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engines
          key: engines-${{ inputs.channel }}-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('src/arcpanel-build.sh', 'src/sources.sha256', 'func/download.sh', 'src/deb/nginx/**', 'src/deb/php/**', 'src/deb/web-terminal/**') }}

      - name: Build packages
        working-directory: src
        run: |
          # The build folder must be root's with mode 0700 (E39 W1 D13)
          install -d -m 700 /tmp/arcpanel-src
          export BUILD_DIR=/tmp/arcpanel-src
          if [ "${{ steps.engines.outputs.cache-hit }}" = "true" ]; then
            bash ./arcpanel-build.sh --arcpanel --noinstall --keepbuild '~localsrc'
          else
            bash ./arcpanel-build.sh --all --noinstall --keepbuild '~localsrc'
          fi

      - name: Collect packages by distribution codename
        run: |
          set -euo pipefail
          . /etc/os-release
          mkdir -p "out/${VERSION_CODENAME}"
          cp /tmp/arcpanel-src/deb/*.deb "out/${VERSION_CODENAME}/"
          if [ "${{ steps.engines.outputs.cache-hit }}" = "true" ]; then
            cp engines/*.deb "out/${VERSION_CODENAME}/"
          else
            mkdir -p engines
            cp /tmp/arcpanel-src/deb/arcpanel-nginx_*.deb /tmp/arcpanel-src/deb/arcpanel-php_*.deb \
              /tmp/arcpanel-src/deb/arcpanel-web-terminal_*.deb engines/
          fi
          ls -l "out/${VERSION_CODENAME}"
          echo "ARTIFACT_NAME=debs-${VERSION_CODENAME}-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Save engine packages
        if: steps.engines.outputs.cache-hit != 'true' && inputs.save-cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engines
          key: ${{ steps.engines.outputs.cache-primary-key }}

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/
          # Only later jobs of this run need them; long retention fills the storage quota.
          retention-days: 1
          if-no-files-found: error
