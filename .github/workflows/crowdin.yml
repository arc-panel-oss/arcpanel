# Inactive for ArcPanel: translations are paused until ArcPanel has its own Crowdin
# project (see the rebranding spec, WP2). Set the CROWDIN_PROJECT_ID variable to turn it on.
name: Crowdin

on:
  workflow_dispatch:

jobs:
  update-pot:
    name: Update .pot file
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        if: vars.CROWDIN_PROJECT_ID != ''
      - name: crowdin action
        uses: crowdin/github-action@v3
        if: vars.CROWDIN_PROJECT_ID != ''
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
