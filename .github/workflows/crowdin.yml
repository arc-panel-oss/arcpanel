# Inactive for ArcPanel: translations are paused until ArcPanel has its own Crowdin
# project (see the rebranding spec, WP2). Set the CROWDIN_PROJECT_ID variable to turn it on.
name: Crowdin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-pot:
    name: Update .pot file
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.CROWDIN_PROJECT_ID != ''
      - name: crowdin action
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        if: vars.CROWDIN_PROJECT_ID != ''
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
