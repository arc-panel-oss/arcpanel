name: Release

# Builds, signs and publishes the ArcPanel APT repository (ADR-0006, spec WP3), which keeps
# every published version (E33 phase 1 P0); the packages are also attached to the GitHub Release.
#
# Tag naming follows src/deb/arcpanel/control:
#   Version 2.3.0         -> tag v2.3.0         -> stable repository  https://apt.arcpanel.top/
#   Version 2.3.0~beta.1  -> tag v2.3.0-beta.1  -> beta repository    https://apt.arcpanel.top/beta/
#
# Every tag sits on its release line branch vX.Y.x; after a stable release the release and
# master branches move forward to the tag (docs/operations/releasing.md, release-branches.sh).
#
# A stable release builds every supported distribution on amd64 and arm64 (arm64 since 2.2.1,
# after arm64-trial.yml passed, E47; installs on arm64 are not supported yet); a pre-release
# builds Ubuntu 24.04 amd64 only. The build steps are in build-debs.yml.
#
# Required secrets of the release environment (see docs/operations/release-signing.md):
#   APT_SIGNING_KEY         ASCII-armored private signing subkey
#   APT_SIGNING_KEY_ID      fingerprint of that subkey
#   APT_DEPLOY_SSH_KEY      private SSH key allowed to write to the APT host
#   APT_DEPLOY_KNOWN_HOSTS  known_hosts line(s) for the APT host
#   APT_DEPLOY_TARGET       user@host:/path/to/webroot (no trailing slash)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on its release line
        run: bash .github/scripts/release-branches.sh check "${GITHUB_REF_NAME}"

      - name: Compare tag, package and installer versions
        id: version
        run: |
          set -euo pipefail
          pkg_ver="$(awk '/^Version:/ {print $2}' src/deb/arcpanel/control)"
          expected_tag="v${pkg_ver//\~/-}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/deb/arcpanel/control Version ${pkg_ver} (expected ${expected_tag})"
            exit 1
          fi
          for installer in install/arcpanel-install-debian.sh install/arcpanel-install-ubuntu.sh; do
            inst_ver="$(grep "^ARCPANEL_INSTALL_VER=" "$installer" | cut -d"'" -f2)"
            if [ "${inst_ver}" != "${pkg_ver}" ]; then
              echo "::error::${installer} ARCPANEL_INSTALL_VER=${inst_ver} does not match package Version ${pkg_ver}"
              exit 1
            fi
          done
          # A pre-release builds Ubuntu 24.04 amd64 only, to save Actions minutes; a stable release builds them all.
          if [[ "${pkg_ver}" == *"~"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo 'matrix={"image":["ubuntu:24.04"],"arch":["amd64"]}' >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo 'matrix={"image":["debian:12","debian:13","ubuntu:22.04","ubuntu:24.04","ubuntu:26.04"],"arch":["amd64","arm64"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/build-debs.yml
    with:
      matrix: ${{ needs.check-version.outputs.matrix }}
      channel: ${{ needs.check-version.outputs.channel }}
      save-cache: true

  # The repository keeps every published version (E33 phase 1 P0,
  # docs/features/specs/2026-10-20-005-e33-update-center-phase-1-design.md §5.1): the job
  # pulls the published repository, adds the new packages, uploads the pool without deleting
  # anything and only then the indexes, and attaches the packages to the GitHub Release.
  publish:
    name: Sign and publish (${{ needs.check-version.outputs.channel }})
    needs: [check-version, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.check-version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: debs-*
          path: debs
          merge-multiple: true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils rsync

      - name: Restore the published repository from the cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: current
          key: apt-repo-${{ env.CHANNEL }}-${{ github.run_id }}
          restore-keys: apt-repo-${{ env.CHANNEL }}-

      - name: Set up the deploy key
        env:
          APT_DEPLOY_SSH_KEY: ${{ secrets.APT_DEPLOY_SSH_KEY }}
          APT_DEPLOY_KNOWN_HOSTS: ${{ secrets.APT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APT_DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$APT_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull the published repository
        env:
          APT_DEPLOY_TARGET: ${{ secrets.APT_DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          remote="${APT_DEPLOY_TARGET}/"
          [ "$CHANNEL" = beta ] && remote="${APT_DEPLOY_TARGET}/beta/"
          mkdir -p current
          # Only dists/ and pool/: the beta repository under / stays out of the stable copy.
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            --include '/dists/***' --include '/pool/***' --exclude '*' "$remote" current/
          echo "Published repository: $(find current/pool -name '*.deb' 2> /dev/null | wc -l) packages, $(du -sh current | cut -f1)"

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import > /dev/null 2>&1

      - name: Build repository
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -d current/dists ]; then
            bash .github/scripts/build-apt-repo.sh repo "$APT_SIGNING_KEY_ID" current debs
          else
            # The first publish of a channel
            bash .github/scripts/build-apt-repo.sh repo "$APT_SIGNING_KEY_ID" - debs
          fi

      - name: Publish repository
        env:
          APT_DEPLOY_TARGET: ${{ secrets.APT_DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          remote="${APT_DEPLOY_TARGET}"
          [ "$CHANNEL" = beta ] && remote="${APT_DEPLOY_TARGET}/beta"
          ssh_cmd="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"
          # The pool first and never deleted, then the indexes that name its files, the signed
          # Release files last (excluded files are not deleted by the first pass), then the key.
          rsync -az -e "$ssh_cmd" repo/pool/ "${remote}/pool/"
          rsync -az --delete --exclude InRelease --exclude Release --exclude Release.gpg -e "$ssh_cmd" \
            repo/dists/ "${remote}/dists/"
          rsync -az --delete -e "$ssh_cmd" repo/dists/ "${remote}/dists/"
          rsync -az -e "$ssh_cmd" repo/arcpanel.gpg "${remote}/arcpanel.gpg"
          rm -f ~/.ssh/id_deploy

      - name: Attach the packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One tar per codename keeps the codename that the file names do not carry for rebuilds.
          mkdir -p assets
          for dir in debs/*/; do
            codename="$(basename "$dir")"
            tar -C debs -cf "assets/debs-${codename}.tar" "${codename}"
          done
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            prerelease=()
            [ "$CHANNEL" = beta ] && prerelease=(--prerelease)
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "ArcPanel ${GITHUB_REF_NAME#v}" \
              --notes "Packages of ArcPanel ${GITHUB_REF_NAME#v} as published to the ${CHANNEL} APT repository." "${prerelease[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" assets/*.tar --clobber

      - name: Keep the new repository for the next release
        run: rm -rf current && mv repo current

      - name: Save the repository in the cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: current
          key: apt-repo-${{ env.CHANNEL }}-${{ github.run_id }}

  advance-branches:
    name: Advance release and master
    needs: [check-version, publish]
    if: needs.check-version.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward release and master to the tag
        run: bash .github/scripts/release-branches.sh advance "${GITHUB_REF_NAME}"
