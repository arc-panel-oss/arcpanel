name: Release

# Builds, signs and publishes the ArcPanel APT repository (ADR-0006, spec WP3), which keeps
# every published version (E33 phase 1 P0); the packages are also attached to the GitHub Release.
#
# Tag naming follows src/deb/arcpanel/control:
#   Version 2.3.0         -> tag v2.3.0         -> stable repository  https://apt.arcpanel.org/
#   Version 2.3.0~beta.1  -> tag v2.3.0-beta.1  -> beta repository    https://apt.arcpanel.org/beta/
#   Version 2.3.0~rc.1    -> tag v2.3.0-rc.1    -> beta repository    https://apt.arcpanel.org/beta/
#
# Every tag sits on its release line branch vX.Y.x; after a stable release the release and
# master branches move forward to the tag (docs/operations/releasing.md, release-branches.sh).
#
# A stable release builds every supported distribution on amd64 and arm64 (arm64 since 2.2.1,
# after arm64-trial.yml passed, E47; installs on arm64 are not supported yet); a pre-release
# builds Ubuntu 24.04 amd64 only. The build steps are in build-debs.yml.
#
# Required secrets of the release environment (see docs/operations/release-signing.md):
#   APT_SIGNING_KEY           ASCII-armored private signing subkey
#   APT_SIGNING_KEY_ID        fingerprint of that subkey
#   APT_R2_ACCESS_KEY_ID      access key id of an R2 API token (Object Read & Write, bucket arcpanel-apt only)
#   APT_R2_SECRET_ACCESS_KEY  secret access key of that token
#   APT_R2_ENDPOINT           https://<account-id>.r2.cloudflarestorage.com
# The repository is the Cloudflare R2 bucket arcpanel-apt (APT_REMOTE), served at
# https://apt.arcpanel.org/ and https://apt.arcpanel.top/.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APT_REMOTE: r2:arcpanel-apt

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on its release line
        run: bash .github/scripts/release-branches.sh check "${GITHUB_REF_NAME}"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Compare tag, package and installer versions
        id: version
        run: |
          set -euo pipefail
          # The control file, both installers, src/release.json and the tag agree
          # (docs/features/specs/2026-10-21-001-release-standards-design.md §7.2)
          npm run release -- check --tag "${GITHUB_REF_NAME}"
          pkg_ver="$(awk '/^Version:/ {print $2}' src/deb/arcpanel/control)"
          # The release metadata of the manifest (E33 phase 1 spec §4)
          bash .github/scripts/release-manifest.sh check src/release.json "${pkg_ver}"
          # A pre-release builds Ubuntu 24.04 amd64 only, to save Actions minutes; a stable release builds them all.
          if [[ "${pkg_ver}" == *"~"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo 'matrix={"image":["ubuntu:24.04"],"arch":["amd64"]}' >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo 'matrix={"image":["debian:12","debian:13","ubuntu:22.04","ubuntu:24.04","ubuntu:26.04"],"arch":["amd64","arm64"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/build-debs.yml
    with:
      matrix: ${{ needs.check-version.outputs.matrix }}
      channel: ${{ needs.check-version.outputs.channel }}
      save-cache: true

  # The repository keeps every published version (E33 phase 1 P0,
  # docs/features/specs/2026-10-20-005-e33-update-center-phase-1-design.md §5.1): the job
  # pulls the published repository from the bucket, adds the new packages and the release to
  # the signed manifest, uploads the pool without deleting anything and only then the indexes
  # and the manifest, and attaches the packages and the manifest to the GitHub Release.
  publish:
    name: Sign and publish (${{ needs.check-version.outputs.channel }})
    needs: [check-version, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.check-version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Write the release notes from the changelog
        # A stable release: changelog/X.Y.Z.md; a pre-release: the fragments of its line
        # (docs/features/specs/2026-10-21-001-release-standards-design.md §5.6)
        run: node scripts/release.mjs changelog notes "${GITHUB_REF_NAME}" > release-notes.md

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: debs-*
          path: debs
          merge-multiple: true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils jq rclone

      - name: Restore the published repository from the cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: current
          key: apt-repo-${{ env.CHANNEL }}-${{ github.run_id }}
          restore-keys: apt-repo-${{ env.CHANNEL }}-

      - name: Set up the R2 remote
        # A token limited to the bucket may not check or create it, hence no_check_bucket
        env:
          APT_R2_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
          APT_R2_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
          APT_R2_ENDPOINT: ${{ secrets.APT_R2_ENDPOINT }}
        run: bash .github/scripts/apt-host.sh configure

      - name: Pull the published repository
        run: |
          set -euo pipefail
          remote="${APT_REMOTE}"
          [ "$CHANNEL" = beta ] && remote="${APT_REMOTE}/beta"
          bash .github/scripts/apt-host.sh pull "$remote" current

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import > /dev/null 2>&1

      - name: Build repository
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -d current/dists ]; then
            bash .github/scripts/build-apt-repo.sh repo "$APT_SIGNING_KEY_ID" current debs
          else
            # The first publish of a channel
            bash .github/scripts/build-apt-repo.sh repo "$APT_SIGNING_KEY_ID" - debs
          fi

      - name: Add the release to the manifest
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          manifest=-
          if [ -f current/releases.json ]; then
            gpg --batch --verify current/releases.json.sig current/releases.json
            manifest=current/releases.json
          fi
          bash .github/scripts/release-manifest.sh add "$manifest" src/release.json debs "$CHANNEL" > repo/releases.json
          gpg --batch --yes --local-user "$APT_SIGNING_KEY_ID" --detach-sign -o repo/releases.json.sig repo/releases.json
          jq -c '.releases[0]' repo/releases.json

      - name: Publish repository
        run: |
          set -euo pipefail
          remote="${APT_REMOTE}"
          [ "$CHANNEL" = beta ] && remote="${APT_REMOTE}/beta"
          bash .github/scripts/apt-host.sh push repo "$remote"
          bash .github/scripts/apt-host.sh unconfigure

      - name: Attach the packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One tar per codename keeps the codename that the file names do not carry for rebuilds.
          mkdir -p assets
          for dir in debs/*/; do
            codename="$(basename "$dir")"
            tar -C debs -cf "assets/debs-${codename}.tar" "${codename}"
          done
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            prerelease=()
            [ "$CHANNEL" = beta ] && prerelease=(--prerelease)
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "ArcPanel ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" assets/*.tar repo/releases.json repo/releases.json.sig --clobber

      - name: Keep the new repository for the next release
        run: rm -rf current && mv repo current

      - name: Save the repository in the cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: current
          key: apt-repo-${{ env.CHANNEL }}-${{ github.run_id }}

  advance-branches:
    name: Advance release and master
    needs: [check-version, publish]
    if: needs.check-version.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward release and master to the tag
        run: bash .github/scripts/release-branches.sh advance "${GITHUB_REF_NAME}"
