name: BATS testsuite

# The steps are in docker-bats.yml, shared with the arm64 trial (E47).

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  docker-bats:
    name: docker-bats
    uses: ./.github/workflows/docker-bats.yml
    with:
      runner: ubuntu-24.04
