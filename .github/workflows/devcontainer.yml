name: Dev container

# Builds .devcontainer/ when it changes, so the container contributors open
# does not break unnoticed (docs/features/specs/2026-11-01-002-dev-container-design.md §3)

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  push:
    branches:
      - develop
      - "v*.x"
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build the dev container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t arcpanel-dev .devcontainer

      - name: Check the tools
        run: docker run --rm arcpanel-dev bash -c 'php -v && composer -V && node -v && npm -v && shellcheck -V'
