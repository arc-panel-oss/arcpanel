name: Rebuild APT repository

# Rebuilds both channels of the APT repository from the packages and manifests attached to
# the GitHub Releases (E33 phase 1 P0, D6,
# docs/features/specs/2026-10-20-005-e33-update-center-phase-1-design.md §5.5 and §5.6).
#   compare  builds in the runner and compares with the published repository; publishes nothing
#   publish  uploads the rebuilt repository to the R2 bucket (after a loss, or to fill a new bucket)
# Runs in the release environment, so every run needs an approval. The secrets are those of
# release.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compare or publish"
        required: true
        type: choice
        options: [compare, publish]
        default: compare

permissions:
  contents: read

env:
  APT_REMOTE: r2:arcpanel-apt

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    environment: release
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils jq rclone

      - name: Download the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/rebuild-apt-repo.sh download releases

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import > /dev/null 2>&1

      - name: Build both channels
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: bash .github/scripts/rebuild-apt-repo.sh build releases rebuilt "$APT_SIGNING_KEY_ID"

      - name: Set up the R2 remote
        env:
          APT_R2_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
          APT_R2_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
          APT_R2_ENDPOINT: ${{ secrets.APT_R2_ENDPOINT }}
        run: bash .github/scripts/apt-host.sh configure

      - name: Compare with or publish to the bucket
        run: |
          set -euo pipefail
          status=0
          for dir in rebuilt/*/; do
            channel="$(basename "$dir")"
            remote="${APT_REMOTE}"
            [ "$channel" = beta ] && remote="${APT_REMOTE}/beta"
            if [ "$MODE" = publish ]; then
              bash .github/scripts/apt-host.sh push "rebuilt/$channel" "$remote"
            else
              bash .github/scripts/apt-host.sh pull "$remote" "live/$channel"
              echo "== $channel"
              bash .github/scripts/rebuild-apt-repo.sh compare "rebuilt/$channel" "live/$channel" || status=1
            fi
          done
          bash .github/scripts/apt-host.sh unconfigure
          exit "$status"
