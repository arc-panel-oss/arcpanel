name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            *.md
            docs/**/*.md

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check downloads, pins and actions (E39 W3)
        run: bash test/supply-chain-check.sh

  brand-check:
    name: Brand check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check user-visible text for the old brand
        run: bash test/brand-check.sh

  template-meta:
    name: Template metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the web template metadata
        run: node scripts/check-template-meta.js

  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install Node packages
        run: npm ci --ignore-scripts

      - name: Check that docs/api/openapi.yaml matches the commands
        run: node scripts/build-openapi.js --check

  openapi-v2:
    name: OpenAPI document of API v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Install the panel app with its dev dependencies
        working-directory: web-app
        run: composer install --no-interaction --no-progress

      - name: Check that docs/api/v2/openapi.json matches the code
        working-directory: web-app
        run: php artisan arcpanel:api-docs --check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          # vendored phpPgAdmin (install/deb/pga/README.txt)
          ignore_paths: install/deb/pga/phppgadmin

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install Node packages
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check .

  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Run Biome lint
        run: biome lint .

  sys-packages:
    name: System packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the system package catalog
        run: |
          sudo install -d /etc/arcpanel
          echo "ARCPANEL='$GITHUB_WORKSPACE'" | sudo tee /etc/arcpanel/arcpanel.conf > /dev/null
          mkdir -p conf log
          touch conf/arcpanel.conf
          bash bin/v-check-sys-packages

  sys-packages-apt:
    name: System packages on ${{ matrix.image }}
    needs: sys-packages
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that every package of the catalog exists
        run: |
          apt-get update -qq
          apt-get install -y -qq jq > /dev/null
          release=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          failed=0
          for file in install/common/apps/system/*.json; do
            for pkg in $(jq -r --arg r "$release" 'if (.os // {}) | has($r) then .os[$r] else .packages end | (. // [])[]' "$file"); do
              if ! apt-cache show "$pkg" > /dev/null 2>&1; then
                echo "$(basename "$file" .json): $pkg is not in the archive of $release"
                failed=1
              fi
            done
          done
          exit "$failed"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go comes with the runner image; the module is checked against the Go checksum database.
      - name: Check the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Test the build, installer and APT repository scripts (E47)
        run: test/test_helper/bats-core/bin/bats test/arcpanel-arm64.bats

      - name: Test the release branch script
        run: test/test_helper/bats-core/bin/bats test/arcpanel-release-branches.bats
