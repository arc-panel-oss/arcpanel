name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            *.md
            docs/**/*.md

  brand-check:
    name: Brand check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check user-visible text for the old brand
        run: bash test/brand-check.sh

  template-meta:
    name: Template metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the web template metadata
        run: node scripts/check-template-meta.js

  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Node packages
        run: npm ci --ignore-scripts

      - name: Check that docs/api/openapi.yaml matches the commands
        run: node scripts/build-openapi.js --check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          # vendored phpPgAdmin (install/deb/pga/README.txt)
          ignore_paths: install/deb/pga/phppgadmin

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Node packages
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check .

  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome lint
        run: biome lint .

  sys-packages:
    name: System packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the system package catalog
        run: |
          sudo install -d /etc/arcpanel
          echo "ARCPANEL='$GITHUB_WORKSPACE'" | sudo tee /etc/arcpanel/arcpanel.conf > /dev/null
          mkdir -p conf log
          touch conf/arcpanel.conf
          bash bin/v-check-sys-packages

  sys-packages-apt:
    name: System packages on ${{ matrix.image }}
    needs: sys-packages
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check that every package of the catalog exists
        run: |
          apt-get update -qq
          apt-get install -y -qq jq > /dev/null
          release=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          failed=0
          for file in install/common/apps/system/*.json; do
            for pkg in $(jq -r --arg r "$release" 'if (.os // {}) | has($r) then .os[$r] else .packages end | (. // [])[]' "$file"); do
              if ! apt-cache show "$pkg" > /dev/null 2>&1; then
                echo "$(basename "$file" .json): $pkg is not in the archive of $release"
                failed=1
              fi
            done
          done
          exit "$failed"
