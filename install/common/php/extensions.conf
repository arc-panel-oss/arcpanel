# PHP extensions the panel manages (E41, docs/features/specs/2026-10-12-001-e41-php-manager-design.md §5.1).
# One line per extension. PACKAGE is the Debian package of the server's PHP
# repository (%v = the version), empty for a module that ships in a base
# package and can only be turned on and off. MODULE is the name phpenmod and
# phpquery use. MIN and MAX limit the versions the entry applies to (empty =
# no limit). REQUIRED='yes' marks the modules every version installs and that
# webmail and phpMyAdmin need: they cannot be removed or turned off.
# CONFLICTS lists entries that cannot be enabled at the same time.
#
# Required base modules
NAME='curl' PACKAGE='php%v-curl' MODULE='curl' GROUP='network' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='gd' PACKAGE='php%v-gd' MODULE='gd' GROUP='image' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='intl' PACKAGE='php%v-intl' MODULE='intl' GROUP='format' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='mbstring' PACKAGE='php%v-mbstring' MODULE='mbstring' GROUP='format' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='mysqli' PACKAGE='php%v-mysql' MODULE='mysqli' GROUP='database' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='pdo_mysql' PACKAGE='php%v-mysql' MODULE='pdo_mysql' GROUP='database' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='xml' PACKAGE='php%v-xml' MODULE='xml' GROUP='format' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
NAME='zip' PACKAGE='php%v-zip' MODULE='zip' GROUP='format' MIN='' MAX='' REQUIRED='yes' CONFLICTS='' NOTE=''
#
# Other modules of the base install
