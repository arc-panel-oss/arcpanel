# ArcPanel app process presets (E42,
# docs/features/specs/2026-10-16-003-e42-app-processes-design.md §5).
# One preset per line. KIND is web (has a port, switches the domain to
# TEMPLATE) or worker (no port), "either" for custom. START and RELOAD may
# use %php% (PHP CLI of the domain's backend version), %python% (.venv/bin
# of the working directory, else /usr/bin), %port% and %module% (the folder
# of wsgi.py or celery.py). RELOAD is restart, signal:<NAME> or
# command:<command>. DETECT lists files of the working directory (comma
# separated) that mark an app for the preset; NEEDS names a PHP module the
# CLI SAPI must have.
NAME='octane-swoole' KIND='web' TEMPLATE='laravel-octane' RUNTIME='php' NEEDS='swoole' DETECT='artisan' TITLE='Laravel Octane (Swoole)' START='%php% artisan octane:start --server=swoole --host=127.0.0.1 --port=%port% --workers=auto --max-requests=500' RELOAD='command:%php% artisan octane:reload'
NAME='octane-roadrunner' KIND='web' TEMPLATE='laravel-octane' RUNTIME='php' NEEDS='' DETECT='artisan,rr' TITLE='Laravel Octane (RoadRunner)' START='%php% artisan octane:start --server=roadrunner --host=127.0.0.1 --port=%port% --workers=auto --max-requests=500' RELOAD='command:%php% artisan octane:reload'
NAME='octane-frankenphp' KIND='web' TEMPLATE='laravel-octane' RUNTIME='php' NEEDS='' DETECT='artisan,frankenphp' TITLE='Laravel Octane (FrankenPHP)' START='%php% artisan octane:start --server=frankenphp --host=127.0.0.1 --port=%port% --workers=auto --max-requests=500' RELOAD='command:%php% artisan octane:reload'
NAME='laravel-queue' KIND='worker' TEMPLATE='' RUNTIME='php' NEEDS='' DETECT='artisan' TITLE='Laravel queue worker' START='%php% artisan queue:work --sleep=3 --tries=3 --max-time=3600' RELOAD='command:%php% artisan queue:restart'
NAME='laravel-horizon' KIND='worker' TEMPLATE='' RUNTIME='php' NEEDS='' DETECT='artisan' TITLE='Laravel Horizon' START='%php% artisan horizon' RELOAD='command:%php% artisan horizon:terminate'
NAME='laravel-scheduler' KIND='worker' TEMPLATE='' RUNTIME='php' NEEDS='' DETECT='artisan' TITLE='Laravel scheduler' START='%php% artisan schedule:work' RELOAD='restart'
NAME='gunicorn' KIND='web' TEMPLATE='django' RUNTIME='python' NEEDS='' DETECT='manage.py' TITLE='Gunicorn (Django)' START='%python%/gunicorn --bind 127.0.0.1:%port% --workers 2 %module%.wsgi' RELOAD='signal:HUP'
NAME='uvicorn' KIND='web' TEMPLATE='flask-fastapi' RUNTIME='python' NEEDS='' DETECT='main.py,app.py' TITLE='Uvicorn (FastAPI, Flask)' START='%python%/uvicorn --host 127.0.0.1 --port %port% main:app' RELOAD='restart'
NAME='celery' KIND='worker' TEMPLATE='' RUNTIME='python' NEEDS='' DETECT='celery.py' TITLE='Celery worker' START='%python%/celery -A %module% worker --loglevel=info' RELOAD='restart'
NAME='go-binary' KIND='web' TEMPLATE='golang-proxy' RUNTIME='any' NEEDS='' DETECT='go.mod' TITLE='Go binary' START='./app' RELOAD='restart'
NAME='puma' KIND='web' TEMPLATE='rails' RUNTIME='ruby' NEEDS='' DETECT='Gemfile,config.ru' TITLE='Puma (Rails)' START='bundle exec puma -b tcp://127.0.0.1:%port% -e production' RELOAD='signal:USR1'
NAME='sidekiq' KIND='worker' TEMPLATE='' RUNTIME='ruby' NEEDS='' DETECT='Gemfile' TITLE='Sidekiq' START='bundle exec sidekiq -e production' RELOAD='restart'
NAME='custom' KIND='either' TEMPLATE='' RUNTIME='any' NEEDS='' DETECT='' TITLE='Custom command' START='' RELOAD='restart'
