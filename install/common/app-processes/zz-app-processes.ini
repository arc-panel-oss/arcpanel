; ArcPanel app processes (E42): PHP settings of the processes, read after the
; CLI php.ini of each PHP version (arc-app-run sets PHP_INI_SCAN_DIR).
;
; An app process runs a command of the user's choice as the user, so
; disable_functions protects nothing there, while Laravel Octane, queue
; workers and Horizon need the pcntl functions that the distribution's
; php.ini disables. This file clears the list for app processes only;
; PHP-FPM sites and other CLI scripts keep the php.ini values.
;
; v-add-sys-app-processes writes this file once and never overwrites it:
; edit it to set your own values.

disable_functions =
