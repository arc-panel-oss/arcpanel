<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<title>Site suspended</title>
		<style>
			:root {
				--bg: #f6f7fb;
				--surface: #ffffff;
				--border: #e3e6ef;
				--text: #141824;
				--muted: #555d70;
				--accent: #2f55d4;
				--accent-subtle: #eef2fe;
				--accent-line: #b9c7f5;
				--status: #c4314b;
				--logo-ring: #0f1320;
				--shadow: 0 1px 2px rgba(20, 24, 36, 0.04), 0 12px 32px rgba(20, 24, 36, 0.06);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0b0d12;
					--surface: #12151d;
					--border: #232838;
					--text: #eef1f7;
					--muted: #a3abbd;
					--accent: #8ea4ff;
					--accent-subtle: #19203d;
					--accent-line: #36468a;
					--status: #ff8a9a;
					--logo-ring: #2c355a;
					--shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
				}
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
			}

			body {
				margin: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				min-height: 100dvh;
				padding: 24px 16px;
				background-color: var(--bg);
				background-image: radial-gradient(
					ellipse 80% 60% at 50% 0%,
					var(--accent-subtle) 0%,
					transparent 70%
				);
				color: var(--text);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
					"Noto Sans", sans-serif;
				font-size: 16px;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			main {
				width: 100%;
				max-width: 520px;
				padding: 48px 32px 40px;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 16px;
				box-shadow: var(--shadow);
				text-align: center;
				animation: rise 0.4s ease-out both;
			}

			/* Same lockup and colours as the panel logo (web-app logo component) */
			.logo {
				display: block;
				height: 32px;
				width: auto;
				margin: 0 auto 32px;
			}

			.logo .lg-tile {
				fill: #0f1320;
			}

			.logo .lg-ring {
				fill: none;
				stroke: var(--logo-ring);
				stroke-width: 2;
			}

			.logo .lg-a {
				fill: none;
				stroke: #9db0ff;
				stroke-width: 8;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.logo .lg-star {
				fill: #f2b451;
			}

			.logo .lg-word {
				fill: none;
				stroke: var(--text);
				stroke-width: 12;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				margin: 0 0 12px;
				font-size: 13px;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--status);
			}

			.status::before {
				content: "";
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: currentColor;
			}

			h1 {
				margin: 0 0 12px;
				font-size: clamp(1.75rem, 5vw, 2.25rem);
				font-weight: 700;
				line-height: 1.2;
				letter-spacing: -0.02em;
				text-wrap: balance;
			}

			.lead {
				margin: 0 auto;
				max-width: 38ch;
				font-size: 1.0625rem;
				color: var(--muted);
				text-wrap: pretty;
			}

			.owner {
				margin: 32px 0 0;
				padding-top: 24px;
				border-top: 1px solid var(--border);
				font-size: 14px;
				color: var(--muted);
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			@media (max-width: 480px) {
				main {
					padding: 40px 20px 32px;
					border-radius: 12px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				main {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<svg class="logo" viewBox="0 -15 720.5 130" role="img" aria-label="ArcPanel">
				<g transform="translate(0 -15) scale(2.03125)">
					<rect class="lg-tile" width="64" height="64" rx="14" />
					<rect class="lg-ring" x="1" y="1" width="62" height="62" rx="13" />
					<path class="lg-a" d="M20 47.5V28.5a12 12 0 0 1 24 0v19M20 36h24" />
					<circle class="lg-star" cx="50.5" cy="13.5" r="3.2" />
				</g>
				<g transform="translate(170 0)">
					<path
						class="lg-word"
						d="M6 94V38A32 32 0 0 1 70 38V94M6 66H70M97.4 94V34M97.4 56A22 22 0 0 1 119.4 34H125.4M199.09 43.93A30 30 0 1 0 199.09 84.07M228.49 94V6H240.49A24 24 0 0 1 240.49 54H228.49M289.89 64a30 30 0 1 0 60 0a30 30 0 1 0 -60 0M349.89 34V94M377.29 94V34M377.29 60A26 26 0 0 1 429.29 60V94M456.69 64H516.69A30 30 0 1 0 509.68 83.28M544.09 6V94"
					/>
				</g>
			</svg>
			<p class="status">Suspended</p>
			<h1>This site is currently suspended</h1>
			<p class="lead">This website is not available right now. Please check back later.</p>
			<p class="owner">Site owner? Contact your hosting provider for more information.</p>
		</main>
	</body>
</html>
