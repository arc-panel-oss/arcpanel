services:
  app:
    image: gitea/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    environment:
      HOME: /var/lib/gitea/git
      GITEA__server__DOMAIN: ${ARC_DOMAIN}
      GITEA__server__SSH_DOMAIN: ${ARC_DOMAIN}
      GITEA__server__ROOT_URL: ${ARC_URL}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__SSH_PORT: ${ARC_PORT_SSH}
      GITEA__database__DB_TYPE: sqlite3
      GITEA__DEFAULT__APP_NAME: ${APP_NAME}
      GITEA__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
    volumes:
      - ${ARC_DATA_DATA}:/var/lib/gitea
      - ${ARC_DATA_CONFIG}:/etc/gitea
