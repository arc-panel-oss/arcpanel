services:
  app:
    image: vaultwarden/server:1.37.3-alpine@sha256:9a905c5cf5df61bb827da3805e160170741c0b53b0c63bb07e1afd3d2e21b1c8
    environment:
      TZ: ${TZ}
      DOMAIN: ${ARC_URL}
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DATA_FOLDER: /data
    volumes:
      - ${ARC_DATA_DATA}:/data
