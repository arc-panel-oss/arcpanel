# The panel's session cookies never reach the webmail client and the
# database tools (E39 W5 N32). Browsers send cookies to every port of a
# host, so a tool on the panel's host would receive arcpanel_session and
# ARCPANELSID; the tools' PHP locations pass $arcpanel_tool_cookie as
# HTTP_COOKIE instead. Installed in /etc/nginx/conf.d/ (http level).
map $http_cookie $arcpanel_tool_cookie_1 {
	default $http_cookie;
	"~^(?<arc_tool_c1a>(?:[^;]*;\s*)*?)arcpanel_session=[^;]*(?:;\s*)?(?<arc_tool_c1b>.*)$" "$arc_tool_c1a$arc_tool_c1b";
}

map $arcpanel_tool_cookie_1 $arcpanel_tool_cookie {
	default $arcpanel_tool_cookie_1;
	"~^(?<arc_tool_c2a>(?:[^;]*;\s*)*?)ARCPANELSID=[^;]*(?:;\s*)?(?<arc_tool_c2b>.*)$" "$arc_tool_c2a$arc_tool_c2b";
}
