# Rate limit of wp-login.php for the wordpress-secure web template (E6 batch 2).
# Installed into /etc/nginx/conf.d/ by the installer and by
# v-add-sys-web-templates-meta. Without this file the template's trigger drops
# its limit_req line.
limit_req_zone   $binary_remote_addr zone=arcpanel_wp_login:10m rate=10r/m;
limit_req_status 429;
