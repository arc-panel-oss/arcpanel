# Fail2Ban configuration file for arcpanel
#
# The commands take the firewall lock themselves; ARCPANEL_FIREWALL_LOCK_HELD
# tells them that this flock already holds it.

[Definition]

actionstart = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/bin/env ARCPANEL_FIREWALL_LOCK_HELD=1 /usr/local/arcpanel/bin/v-add-firewall-chain <name>
actionstop = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/bin/env ARCPANEL_FIREWALL_LOCK_HELD=1 /usr/local/arcpanel/bin/v-delete-firewall-chain <name>
actioncheck = /usr/sbin/nft list set inet arcpanel f2b_<name>_4 > /dev/null 2>&1
actionban = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/bin/env ARCPANEL_FIREWALL_LOCK_HELD=1 /usr/local/arcpanel/bin/v-add-firewall-ban <ip> <name>
actionunban = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/bin/env ARCPANEL_FIREWALL_LOCK_HELD=1 ARCPANEL_F2B_CALLER=1 /usr/local/arcpanel/bin/v-delete-firewall-ban <ip> <name>
