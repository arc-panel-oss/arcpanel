# Fail2Ban configuration file for arcpanel

[Definition]

actionstart = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/local/arcpanel/bin/v-add-firewall-chain <name>
actionstop = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/local/arcpanel/bin/v-delete-firewall-chain <name>
actioncheck = /usr/sbin/iptables -n -L INPUT | grep -q 'fail2ban-<name>[ \t]'
actionban = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/local/arcpanel/bin/v-add-firewall-ban <ip> <name>
actionunban = /usr/bin/flock -w 30 /run/arcpanel-firewall.lock /usr/bin/env ARCPANEL_F2B_CALLER=1 /usr/local/arcpanel/bin/v-delete-firewall-ban <ip> <name>
