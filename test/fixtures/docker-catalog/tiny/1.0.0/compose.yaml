services:
  web:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command:
      - sh
      - -c
      - mkdir -p /www && printf '%s %s\n' "$$GREETING" "$$MARK" > /www/index.html && exec httpd -f -p 8080 -h /www
    environment:
      GREETING: ${GREETING}
      SECRET: ${SECRET}
      SEED: ${SEED}
      MARK: "v1"
    volumes:
      - ${ARC_DATA_WWW}:/www
