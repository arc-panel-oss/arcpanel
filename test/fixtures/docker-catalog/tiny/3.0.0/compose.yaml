services:
  web:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command:
      - sh
      - -c
      - rm -f /www/keep.txt; exit 1
    environment:
      GREETING: ${GREETING}
      SECRET: ${SECRET}
      SEED: ${SEED}
      MARK: "v3"
    volumes:
      - ${ARC_DATA_WWW}:/www
